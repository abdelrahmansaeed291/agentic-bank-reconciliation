apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: bank-reconciliation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: agentic-bank-reconciliation/agent-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: reconciliation-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
