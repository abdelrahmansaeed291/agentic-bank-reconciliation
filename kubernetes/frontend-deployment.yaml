apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bank-reconciliation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: agentic-bank-reconciliation/frontend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: reconciliation-config
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
