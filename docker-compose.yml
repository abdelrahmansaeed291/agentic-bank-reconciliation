services:
  banking-service:
    build:
      context: ./banking-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
      args:
        INSTALL_BEDROCK: ${INSTALL_BEDROCK:-false}
    environment:
      BANKING_SERVICE_URL: http://banking-service:8001
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-5-sonnet-20240620-v1:0}
    depends_on:
      banking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      AGENT_SERVICE_URL: http://agent-service:8000
    ports:
      - "8501:8501"
    depends_on:
      agent-service:
        condition: service_healthy
